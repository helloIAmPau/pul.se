scalar Timestamp
scalar UUID

type Event {
  uid: UUID!
  name: String!
  description: String!
  start_timestamp: Timestamp!
  end_timestamp: Timestamp!
  price: Float!
  currency: String!
}

input EventInput {
  uid: UUID
  name: String!
  description: String!
  start_timestamp: Timestamp!
  end_timestamp: Timestamp!
  price: Float!
  currency: String!
}

type Query {
  events: [ Event ]!
}

type Mutation {
  updateEvent(event: EventInput!): UUID!
}
