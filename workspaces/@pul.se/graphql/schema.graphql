scalar UUID
scalar StreamState
scalar Timestamp
scalar URL

type StreamSession {
  app: UUID!,
  name: String!,
  url: URL!,
  state: StreamState!,
  timestamp: Timestamp!
}

type Stream {
  name: String!
  app: UUID!
  key: UUID!
}

type Query {
  streamSession(app: UUID!): StreamSession
  live: [ StreamSession ]!
  streams: [ Stream ]!
}
