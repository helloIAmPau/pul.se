scalar UUID
scalar StreamState
scalar Timestamp
scalar URL

type StreamSession {
  app: UUID!,
  name: String!,
  url: URL!,
  state: StreamState!,
  timestamp: Timestamp!
}

type Stream {
  name: String!
  app: UUID!
  key: UUID!
}

input NameInput {
  app: UUID!
  name: String!
}

type Query {
  streamSession(app: UUID!): StreamSession
  live: [ StreamSession ]!
  streams: [ Stream ]!
  stream(app: UUID!): Stream
  vods(app: UUID!): [ StreamSession ]!
}

type Mutation {
  updateName(name: NameInput!): Stream
  regenerateKey(app: UUID!): Stream
  deleteStream(app: UUID!): Stream
}
