services:
  ingress:
    image: 'caddy:2.10.2-alpine'
    restart: 'always'
    ports:
      - '80:80'
      - '443:443'
    configs:
      - source: 'caddyfile'
        target: '/etc/caddy/Caddyfile'
    networks:
      - 'frontend'
  streams:
    image: 'pul.se/streams:0.0.0'
    restart: 'always'
    build:
      dockerfile: 'Dockerfile.node'
      args:
        service: 'streams'
    volumes:
      - './data/segments:/segments'
    networks:
      - 'frontend'
  graphql:
    image: 'pul.se/graphql:0.0.0'
    restart: 'always'
    build:
      dockerfile: 'Dockerfile.node'
      args:
        service: 'graphql'
    environment:
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}'
    networks:
      - 'frontend'
      - 'backend'
  auth:
    image: 'pul.se/auth:0.0.0'
    restart: 'always'
    build:
      dockerfile: 'Dockerfile.node'
      args:
        service: 'auth'
    environment:
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'GOOGLE_OAUTH_CLIENTID=${GOOGLE_OAUTH_CLIENTID}'
      - 'GOOGLE_OAUTH_CLIENTSECRET=${GOOGLE_OAUTH_CLIENTSECRET}'
      - 'APP_HOST=${APP_HOST}'
      - 'JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}'
      - 'JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}'
    networks:
      - 'frontend'
      - 'backend'
  web:
    image: 'pul.se/web:0.0.0'
    restart: 'always'
    build:
      dockerfile: 'Dockerfile.node'
      args:
        service: 'web'
    networks:
      - 'frontend'
  remuxer:
    image: 'pul.se/remuxer:0.0.0'
    restart: 'always'
    ports:
      - '1935:1935'
    volumes:
      - './data/segments:/segments'
    build:
      dockerfile: '../Dockerfile.remuxer'
      context: './remuxer'
    networks:
      - 'frontend'
  postgres:
    image: 'postgres:18.1-alpine'
    restart: 'always'
    volumes:
      - './data/postgres:/var/lib/postgresql/18/docker'
    environment:
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_DB=${POSTGRES_DB}'
    networks:
      - 'backend'

networks:
  frontend:
  backend:
  
configs:
  caddyfile:
    content: |
      ${APP_HOST} {
        reverse_proxy http://web

        reverse_proxy /streams/* http://streams
        reverse_proxy /auth/* http://auth
        reverse_proxy /graphql http://graphql
      }
